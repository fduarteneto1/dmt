<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Calculadora de DMT – BKP Construtora</title>
<script src="cripto.js"></script>
<style>
  :root{--bg:#f5f6f4;--card:#fff;--ink:#1f2a24;--mut:#66706a;--line:#dde1dc;--acc:#1f6b45;--erro:#b42318}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{padding:10px 16px;background:var(--acc);color:#fff;display:flex;align-items:baseline;gap:12px}
  header h1{font-size:17px;margin:0} header span{opacity:.8;font-size:12.5px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  form{width:340px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
  h2{font-size:16px;margin:0 0 4px} p{margin:0 0 14px;color:var(--mut);font-size:13px}
  label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 3px}
  input[type=text],input[type=password]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .chk{display:flex;align-items:center;gap:6px;margin-top:12px;color:var(--ink)}
  button{width:100%;margin-top:16px;padding:9px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:6px;font:inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--erro)}
  #msg.ok{color:var(--mut)}
</style>
</head>
<body>
<header><h1>Calculadora de DMT</h1><span>BKP Construtora · Mato Grosso</span></header>
<main>
  <form id="f" autocomplete="on" hidden>
    <h2>Acesso restrito</h2>
    <p>Entre com o usuário e a senha que você recebeu.</p>
    <label for="u">Usuário</label>
    <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="s">Senha</label>
    <input type="password" id="s" name="password" autocomplete="current-password" required>
    <label class="chk"><input type="checkbox" id="lembrar"> Manter conectado neste computador</label>
    <button id="b">Entrar</button>
    <div id="msg" role="status"></div>
  </form>
</main>
<script>
(async function(){
  const SESSAO = 'dmt_sessao';
  const $ = id => document.getElementById(id), msg = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : ''; };
  const ler = () => { try{ return JSON.parse(sessionStorage.getItem(SESSAO) || localStorage.getItem(SESSAO) || 'null'); }catch(e){ return null; } };
  const apagar = () => { try{ sessionStorage.removeItem(SESSAO); localStorage.removeItem(SESSAO); }catch(e){} };
  const buscar = async n => { const r = await fetch(n, {cache:'no-cache'}); if(!r.ok) throw new Error(n + ': HTTP ' + r.status); return r.text(); };

  async function abrir(s){
    const html = await DMTC.decifrar(s.k, await buscar('app.enc'));
    const boot = '<script src="cripto.js"><\/script><script>window.DMT_SESSAO=' + JSON.stringify({k: s.k, u: s.u}).replace(/</g, '\\u003c') + ';<\/script>';
    document.open(); document.write(html.replace(/<head>/i, '<head>' + boot)); document.close();
  }

  const s = ler();
  if(s && s.k){
    try{ await abrir(s); return; }catch(e){ apagar(); } // chave antiga ou inválida: pede login de novo
  }
  $('f').hidden = false; $('u').focus();
  $('f').onsubmit = async ev => {
    ev.preventDefault(); $('b').disabled = true; msg('Conferindo…', true);
    try{
      const k = await DMTC.entrar(JSON.parse(await buscar('usuarios.json')), $('u').value, $('s').value);
      if(!k){ msg('Usuário ou senha inválidos.'); $('b').disabled = false; $('s').select(); return; }
      const sessao = {k, u: DMTC.norm($('u').value)};
      try{ ($('lembrar').checked ? localStorage : sessionStorage).setItem(SESSAO, JSON.stringify(sessao)); }catch(e){}
      msg('Abrindo…', true);
      await abrir(sessao);
    }catch(e){ msg('Não foi possível abrir a ferramenta. Verifique a internet e tente de novo.'); $('b').disabled = false; }
  };
})();
</script>
</body>
</html>
