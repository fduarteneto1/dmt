<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F1F1F">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BKP 360º">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Gestão 360º BKP</title>
<script src="cripto.js"></script>
<link rel="stylesheet" href="tema.css?v=2">
<style>
  :root{--erro:#b42318}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  form{width:360px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:22px}
  h2{font-size:19px;font-weight:700;margin:0 0 4px;letter-spacing:.01em} p{margin:0 0 14px;color:var(--ink2);font-size:12.5px}
  input[type=text],input[type=password]{width:100%}
  .chk{display:flex;align-items:center;gap:6px;margin-top:14px}
  form>button{width:100%;margin-top:16px;padding:10px 16px}
  #msg{min-height:20px;margin-top:10px;font-size:12.5px;color:var(--erro)}
  #msg.ok{color:var(--ink3)}
  .lema{margin:12px 0 0;text-align:center;font-style:italic;font-size:13px;color:var(--ink2)}
</style>
</head>
<body>
<header><img class="logo-bkp" src="logo-bkp.png" alt="BKP Construtora"><div class="tit"><h1>Gestão 360º BKP</h1><span>BKP Construtora · Mato Grosso</span></div></header>
<main>
  <form id="f" autocomplete="on" hidden>
    <h2>Acesso restrito</h2>
    <p>Entre com o usuário e a senha que você recebeu.</p>
    <label for="u">Usuário</label>
    <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="s">Senha</label>
    <input type="password" id="s" name="password" autocomplete="current-password" required>
    <p class="lema">“Não se gerencia o que não se mede.”</p>
    <label class="chk"><input type="checkbox" id="lembrar"> Manter conectado neste aparelho</label>
    <button id="b">Entrar</button>
    <div id="msg" role="status"></div>
  </form>
</main>
<script>
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
(async function(){
  const SESSAO = 'dmt_sessao';
  const $ = id => document.getElementById(id), msg = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : ''; };
  const ler = () => { try{ return JSON.parse(sessionStorage.getItem(SESSAO) || localStorage.getItem(SESSAO) || 'null'); }catch(e){ return null; } };
  const apagar = () => { try{ sessionStorage.removeItem(SESSAO); localStorage.removeItem(SESSAO); }catch(e){} };
  const buscar = async n => { const r = await fetch(n, {cache:'no-cache'}); if(!r.ok) throw new Error(n + ': HTTP ' + r.status); return r.text(); };

  async function abrir(s){
    let html = await DMTC.decifrar(s.k, await buscar('app.enc'));
    // módulos bloqueados para este usuário (definidos pelo master na janela Usuários)
    let bloq = [];
    try{ const uj = JSON.parse(await buscar('usuarios.json')); bloq = ((uj.bloq || {})[await DMTC.idUsuario(s.u)] || []).filter(a => typeof a === 'string'); }catch(e){}
    if(DMTC.norm(s.u) === 'bkp') bloq = [];
    // Aprovações: só para quem foi liberado ("+apr") e para o master
    const apr = DMTC.norm(s.u) === 'bkp' || bloq.includes('+apr');
    const boot = '<script src="cripto.js"><\/script><script>window.DMT_SESSAO=' + JSON.stringify({k: s.k, u: s.u, b: bloq}).replace(/</g, '\\u003c') + ';<\/script>';
    const app = '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1F1F1F"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BKP 360º"><meta name="apple-mobile-web-app-status-bar-style" content="black">';
    const tema = app + '<link rel="stylesheet" href="tema.css?v=2">';
    const cab = '<header><img class="logo-bkp" src="logo-bkp.png" alt="BKP Construtora"><div class="tit"><h1>Gestão 360º BKP</h1><span>BKP Construtora · Mato Grosso</span></div>';
    html = html.replace(/<head>/i, '<head>' + boot).replace(/<\/head>/i, tema + '</head>')
               .replace(/<\/body>/i, '<script src="obras-sync.js?v=1"><\/script><script src="equipamentos.js?v=1"><\/script><script src="diarias.js?v=2"><\/script><script src="cotacao.js?v=13"><\/script>' + (apr ? '<script src="aprovacoes.js?v=1"><\/script>' : '') + '<script src="clima.js?v=2"><\/script><script src="rotas.js?v=2"><\/script><script src="pedagios.js?v=1"><\/script><script src="fornecedores-mapa.js?v=3"><\/script><script src="relatorios.js?v=2"><\/script><script src="usinadas.js?v=2"><\/script><script src="rel-cotacoes.js?v=2"><\/script>' + (bloq.includes('rh') ? '' : '<script src="rh.js?v=5"><\/script><script src="rel-rh.js?v=1"><\/script>') + '<script src="usuarios-pend.js?v=2"><\/script><script src="acesso.js?v=2"><\/script><script src="layout.js?v=4"><\/script><script src="visual.js?v=2"><\/script></body>')
               .replace('<header><h1>Gestão 360º BKP</h1><span>BKP Construtora · Mato Grosso</span>', cab);
    document.open(); document.write(html); document.close();
  }

  const s = ler();
  if(s && s.k){
    try{ await abrir(s); return; }catch(e){ apagar(); } // chave antiga ou inválida: pede login de novo
  }
  $('f').hidden = false; $('u').focus();
  $('f').onsubmit = async ev => {
    ev.preventDefault(); $('b').disabled = true; msg('Conferindo…', true);
    try{
      const k = await DMTC.entrar(JSON.parse(await buscar('usuarios.json')), $('u').value, $('s').value);
      if(!k){ msg('Usuário ou senha inválidos.'); $('b').disabled = false; $('s').select(); return; }
      const sessao = {k, u: DMTC.norm($('u').value)};
      try{ ($('lembrar').checked ? localStorage : sessionStorage).setItem(SESSAO, JSON.stringify(sessao)); }catch(e){}
      msg('Abrindo…', true);
      await abrir(sessao);
    }catch(e){ msg('Não foi possível abrir a ferramenta. Verifique a internet e tente de novo.'); $('b').disabled = false; }
  };
})();
</script>
</body>
</html>
